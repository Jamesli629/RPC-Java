# ============================================
# RPC-Java 统一配置文件
# 修改此文件即可调整框架行为，无需修改代码
# ============================================

# ===== 服务端配置 =====
# 服务监听地址
rpc.server.host=127.0.0.1
# 服务监听端口
rpc.server.port=9999

# 服务端线程池配置
rpc.server.thread-pool.max-size=1000
rpc.server.thread-pool.keep-alive-seconds=60
rpc.server.thread-pool.queue-capacity=100

# 服务端业务线程池（ExecutionHandler，将反射调用从 IO 线程卸载）
rpc.server.business-pool.core-size=16
rpc.server.business-pool.max-size=64
rpc.server.business-pool.queue-capacity=200

# 服务端健康检查配置
rpc.server.health-check.port=8080

# 服务端限流配置（令牌桶）
# 压测时调大：rate-ms=1 表示每 1ms 产生 1 个令牌（1000 QPS），capacity=10000 允许大突发
rpc.server.rate-limit.rate-ms=1
rpc.server.rate-limit.capacity=10000

# ===== 客户端配置 =====
# 请求超时时间（秒）
rpc.client.request-timeout-seconds=10

# 重试策略
rpc.client.retry.wait-seconds=2
rpc.client.retry.max-attempts=3
rpc.client.retry.trigger-code=500

# 熔断器配置
rpc.client.circuit-breaker.failure-threshold=3
rpc.client.circuit-breaker.half-open-success-rate=0.5
rpc.client.circuit-breaker.retry-time-period-ms=10000

# 负载均衡配置（一致性哈希虚拟节点数）
rpc.client.load-balance.virtual-node-count=5

# ===== ZooKeeper 配置 =====
# ZK 连接地址
rpc.zk.connect-string=127.0.0.1:2181
# ZK 根路径
rpc.zk.root-path=MyRPC
# 重试白名单路径
rpc.zk.retry-path=CanRetry
# ZK 会话超时时间（毫秒）
rpc.zk.session-timeout-ms=40000
# ZK 重试初始间隔（毫秒）
rpc.zk.retry-base-sleep-ms=1000
# ZK 最大重试次数
rpc.zk.retry-max-times=3
